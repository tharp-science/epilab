# Batch-07 Grid-07 manifest (planning artifact; no runs yet)

batch:
  id: exp_007_grid07
  description: >
    Boundary-mapping grid over formal eligibility parameter x (founding/fast_mover
    high-tolerance count per persona block). Baseline scaffold matches 006c/006d/006e
    with peripheral forward overlap enabled and symmetric cap W=5.0.
  status: planned_not_executed

baseline_scaffold:
  canonical_scaffold_source: configs/exp_006c_partial_overlap_eligibility.yaml
  template_file_for_generation: configs/exp_006d_overlap_mid.yaml
  normalization_rule: >
    All non-x settings are normalized to the canonical 006c-derived scaffold.
    Template reuse must not introduce additional parameter drift.
  fixed_assumptions:
    reversibility: true
    peripheral_forward_overlap: true
    symmetric_weight_cap: 5.0
    topology:
      type: small_world
      k: 6
      p: 0.1
    ticks: 5000

control_parameter:
  name: x
  definition: >
    Number of high-tolerance founding nodes and high-tolerance fast_mover nodes
    per persona block (count=8 each).
  per_persona_count: 8
  derived_signatures:
    rho_r: "(84 + 2x) / 100"
    rho_cr: "(72 + 2x) / 100"
    jaccard_c_r: "rho_cr"

grid_points:
  - id: g0
    x: 0
    fn_high_fraction: 0.0
    fm_high_fraction: 0.0
    rho_r: 0.84
    rho_cr: 0.72
    jaccard_c_r: 0.72
    anchor: exp_006c_partial_overlap_eligibility

  - id: g1
    x: 2
    fn_high_fraction: 0.25
    fm_high_fraction: 0.25
    rho_r: 0.88
    rho_cr: 0.76
    jaccard_c_r: 0.76

  - id: g2
    x: 3
    fn_high_fraction: 0.375
    fm_high_fraction: 0.375
    rho_r: 0.90
    rho_cr: 0.78
    jaccard_c_r: 0.78

  - id: g3
    x: 4
    fn_high_fraction: 0.5
    fm_high_fraction: 0.5
    rho_r: 0.92
    rho_cr: 0.80
    jaccard_c_r: 0.80
    anchor: exp_006d_overlap_mid

  - id: g4
    x: 5
    fn_high_fraction: 0.625
    fm_high_fraction: 0.625
    rho_r: 0.94
    rho_cr: 0.82
    jaccard_c_r: 0.82

  - id: g5
    x: 6
    fn_high_fraction: 0.75
    fm_high_fraction: 0.75
    rho_r: 0.96
    rho_cr: 0.84
    jaccard_c_r: 0.84
    anchor: exp_006e_overlap_high

  - id: g6
    x: 8
    fn_high_fraction: 1.0
    fm_high_fraction: 1.0
    rho_r: 1.00
    rho_cr: 0.88
    jaccard_c_r: 0.88

seeds:
  values: [2, 8, 16, 23, 42, 57, 73, 91, 123, 211]
  n_per_point: 10

basin_assignment:
  epsilon: 0.002
  canonical_endpoints:
    merge_k1: 0.03807692307692312
    split_k2: 0.07259259259259254
    asymmetric_split_external: 0.08137614678899086
  rule: >
    Assign basin only if endpoint is within epsilon of a canonical endpoint.
    Otherwise classify as off-manifold.

data_requirements:
  primary_metric:
    - authority_concentration_gini
  specialization_metrics:
    - channel_top1_owner_overlap
    - channel_specialization_tvd
    - forward_channel_top1_share
    - reversion_channel_top1_share
  early_capture_metrics:
    - forward_capture_tick_top1_ge_threshold
    - reversion_capture_tick_top1_ge_threshold
    - channel_top1_owner_overlap_early
    - channel_capture_share_threshold
    - channel_early_horizon_tick
  support_metrics:
    - total_reversions
    - forward_channel_transitions
    - reversion_channel_transitions

aggregation:
  basin_probabilities:
    - P(k=1)
    - P(k=2)
  per_point_stats:
    - mean_channel_specialization_tvd
    - variance_channel_specialization_tvd
    - mean_channel_top1_owner_overlap
    - mean_forward_capture_tick
    - mean_reversion_capture_tick
  boundary_targets:
    - first_point_where_merge_is_majority_favored
    - mixed_basin_region_width
    - non_monotonic_reversal_flags

execution_notes:
  preflight_signature_check: "python3 tools/eligibility_signature.py <config> --pretty"
  run_command_template: "python3 run.py <config> --seed <seed>"
