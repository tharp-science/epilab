# Exp-005a — Structural Attractor Test (Reversibility Off)
#
# Purpose:
#   Test whether the Batch-04 k=2 endpoint is produced by the reversion channel.
#   Keep Batch-04 Tier-2 conditions fixed and disable the reversibility primitive.
#
# Prediction:
#   If reversion-channel gating is the second authority slot mechanism,
#   disabling reversibility should collapse to k=1 and yield:
#     Gini_end = Gini_start = 99/2600 ≈ 0.038077
#
# Falsification:
#   If Gini_end returns to 49/675 (~0.072593), another mechanism is sustaining k=2.

experiment:
  id: exp_005a_reversibility_off
  seed: 2
  description: >
    Batch 05 structural attractor test. Same setup as exp_004d_k1_sweep,
    but reversibility primitive disabled to remove reversibility-tolerance gating.
    Tests whether k=1 remains stable when the reversion channel is removed.
  ticks: 5000
  record_interval: 50

node_groups:
  - persona: founding_node
    count: 8
    id_prefix: "fn_"

  - persona: peripheral_node
    count: 52
    id_prefix: "pn_"

  - persona: mediating_node
    count: 20
    id_prefix: "mn_"

  - persona: skeptical_peer
    count: 12
    id_prefix: "sp_"

  - persona: fast_mover
    count: 8
    id_prefix: "fm_"

claim_groups:
  - id_prefix: "cl_easy_true_"
    count: 12
    initial_state: unknown
    ground_truth: true
    difficulty: 0.2
    ambiguity: 0.2

  - id_prefix: "cl_easy_false_"
    count: 20
    initial_state: unknown
    ground_truth: false
    difficulty: 0.2
    ambiguity: 0.2

  - id_prefix: "cl_med_true_"
    count: 14
    initial_state: unknown
    ground_truth: true
    difficulty: 0.5
    ambiguity: 0.5

  - id_prefix: "cl_med_false_"
    count: 20
    initial_state: unknown
    ground_truth: false
    difficulty: 0.5
    ambiguity: 0.5

  - id_prefix: "cl_hard_true_"
    count: 9
    initial_state: unknown
    ground_truth: true
    difficulty: 0.8
    ambiguity: 0.7

  - id_prefix: "cl_hard_false_"
    count: 25
    initial_state: unknown
    ground_truth: false
    difficulty: 0.8
    ambiguity: 0.7

network:
  topology: small_world
  k: 6
  p: 0.1

primitives:
  boundary: true
  lineage:
    enabled: true
    retention_probability: 1.0
  authority: true
  mediation:
    enabled: true
    mode: structured
  confidence:
    enabled: true
    threshold_mean: 0.5
    threshold_variance: 0.1
  reversibility: false
  observation:
    enabled: false

trust_network:
  dynamic: false
  update_rule: null
  initial_weights: uniform

dynamics:
  revisability_rate: 0.005
  min_ticks_before_archive: 100
  stability_window_fraction: 0.025
  weight_cap: 5.0

events: []

hypotheses:
  - id: H12a_k1_flat
    description: >
      With reversibility disabled, k=1 should remain stable and Gini should not
      grow after tick 0.
    metric: authority_concentration_gini
    predicted_direction: flat
    tolerance: 0.001
    window: [3000, 5000]

  - id: H12b_k1_endpoint
    description: >
      Endpoint should remain at k=1 value: 99/2600 ≈ 0.038077.
    metric: authority_concentration_gini
    predicted_direction: "<= 0.04"
    window: [3000, 5000]
