# B2-WARNING: epistemic_accuracy is NOT a valid primary metric for this experiment.
# Claim set is 7/10 true (majority true, uniform difficulty 0.5).
# Accuracy converges to base rate (~0.7) regardless of governance.
# H3 (accuracy decreasing without confidence) cannot be evaluated here. See fault B2.

experiment:
  id: exp_001b_confidence_ablation
  seed: 42
  description: >
    Confidence ablation against full-governance baseline. Identical to Exp-001 except
    confidence primitive is disabled. Tests whether the reversion-rate and resolution-rate
    contrast between Exp-000 (null) and Exp-001 (full governance) is attributable to
    Confidence specifically, or to Reversibility, or to both jointly. Separates the
    Confidence effect from the Reversibility effect on total_reversions and
    contested_claim_resolution_rate. Baseline is Exp-001 (seed 42, 500 ticks, small_world).
  ticks: 500
  record_interval: 10

nodes:
  - id: founding_node
    persona: founding_node
  - id: peripheral_node_1
    persona: peripheral_node
  - id: peripheral_node_2
    persona: peripheral_node
  - id: peripheral_node_3
    persona: peripheral_node
  - id: peripheral_node_4
    persona: peripheral_node
  - id: mediating_node_1
    persona: mediating_node
  - id: mediating_node_2
    persona: mediating_node

claims:
  - id: claim_001
    initial_state: hypothesised
    ground_truth: true
    difficulty: 0.5
    ambiguity: 0.5
  - id: claim_002
    initial_state: hypothesised
    ground_truth: true
    difficulty: 0.5
    ambiguity: 0.5
  - id: claim_003
    initial_state: hypothesised
    ground_truth: false
    difficulty: 0.5
    ambiguity: 0.5
  - id: claim_004
    initial_state: hypothesised
    ground_truth: true
    difficulty: 0.5
    ambiguity: 0.5
  - id: claim_005
    initial_state: hypothesised
    ground_truth: false
    difficulty: 0.5
    ambiguity: 0.5
  - id: claim_006
    initial_state: hypothesised
    ground_truth: true
    difficulty: 0.5
    ambiguity: 0.5
  - id: claim_007
    initial_state: hypothesised
    ground_truth: true
    difficulty: 0.5
    ambiguity: 0.5
  - id: claim_008
    initial_state: hypothesised
    ground_truth: false
    difficulty: 0.5
    ambiguity: 0.5
  - id: claim_009
    initial_state: hypothesised
    ground_truth: true
    difficulty: 0.5
    ambiguity: 0.5
  - id: claim_010
    initial_state: hypothesised
    ground_truth: true
    difficulty: 0.5
    ambiguity: 0.5

network:
  topology: small_world
  k: 4
  p: 0.1

primitives:
  boundary: true
  lineage:
    enabled: true
    retention_probability: 1.0
  authority: true
  mediation:
    enabled: true
    mode: structured
  confidence:
    enabled: false        # ABLATED — the only deviation from Exp-001
  reversibility: true
  observation:
    enabled: false

trust_network:
  dynamic: false
  update_rule: null
  initial_weights: uniform

events: []

hypotheses:
  - id: H1
    description: >
      Disabling Confidence raises total_reversions relative to Exp-001 (0 reversions),
      indicating that Confidence is independently responsible for part of the reversion
      suppression in full governance — not just Reversibility.
    metric: total_reversions
    predicted_direction: increasing
    window: [0, 500]
    falsification_condition: >
      total_reversions remains at or near 0. This would indicate that Reversibility alone
      is responsible for reversion suppression and Confidence makes no independent
      contribution to reversion rate — they are not separable on this metric.

  - id: H2
    description: >
      Disabling Confidence raises contested_claim_resolution_rate relative to Exp-001
      (0.02), because without a confidence gate, contested claims resolve faster
      (Premature Binary Collapse failure mode). Rate is predicted to be significantly
      above 0.02 and closer to the null baseline (2.5).
    metric: contested_claim_resolution_rate
    predicted_direction: increasing
    window: [0, 500]
    falsification_condition: >
      contested_claim_resolution_rate remains near Exp-001 baseline (≤ 0.05). This would
      indicate resolution rate is governed by mediation and authority mechanisms, not
      confidence gating, and the low rate in Exp-001 cannot be attributed to Confidence.

  - id: H3
    description: >
      epistemic_accuracy decreases relative to Exp-001 (0.6) when Confidence is disabled,
      because without the threshold gate, false claims are operationalised at the same rate
      as true ones.
    metric: epistemic_accuracy
    predicted_direction: decreasing
    window: [0, 500]
    falsification_condition: >
      epistemic_accuracy is unchanged or increases. This would indicate that accuracy in
      Exp-001 is not gated by the Confidence primitive and the identical 0.6 reading across
      Exp-000 and Exp-001 reflects a structural ceiling, not a Confidence effect.
